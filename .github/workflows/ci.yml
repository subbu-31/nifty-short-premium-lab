name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (BSM solver, walk-forward classifier)
        run: python -m pytest tests/ -v
      - name: Smoke test (backtest engine, synthetic chain)
        run: make smoke
      - name: Config load check (cost scenario YAMLs actually parse and match expected values)
        run: |
          python -c "
          from pipeline.cost.cost_scenarios import CostScenario
          illus = CostScenario.load('config/cost_scenarios/illustrative.yaml')
          calib = CostScenario.load('config/cost_scenarios/calibrated.yaml')
          assert illus.short_leg_cost == 0.5
          assert calib.short_leg_cost == 0.971
          print('config load: OK')
          "
